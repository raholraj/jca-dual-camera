name: Build Dual Camera APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone Jetpack Camera App
        run: git clone --depth 1 https://github.com/google/jetpack-camera-app.git jca

      - name: Apply dual-camera patches
        run: |
          set -e
          JCA=jca

          mkdir -p $JCA/core/model/src/main/java/com/google/jetpackcamera/model
          if [ -f core/model/DualRecordingMode.kt ]; then
            cp core/model/DualRecordingMode.kt $JCA/core/model/src/main/java/com/google/jetpackcamera/model/
          fi

          mkdir -p $JCA/core/camera/src/main/java/com/google/jetpackcamera/core/camera
          for f in CoroutineCameraProvider.kt CameraSessionSettings.kt ConcurrentCameraSession.kt; do
            if [ -f core/camera/$f ]; then
              cp core/camera/$f $JCA/core/camera/src/main/java/com/google/jetpackcamera/core/camera/
            fi
          done

          mkdir -p $JCA/ui/controller/src/main/java/com/google/jetpackcamera/ui/controller
          if [ -f ui/controller/DualCameraController.kt ]; then
            cp ui/controller/DualCameraController.kt $JCA/ui/controller/src/main/java/com/google/jetpackcamera/ui/controller/
          fi
          mkdir -p $JCA/ui/controller/impl/src/main/java/com/google/jetpackcamera/ui/controller/impl
          if [ -f ui/controller/DualCameraControllerImpl.kt ]; then
            cp ui/controller/DualCameraControllerImpl.kt $JCA/ui/controller/impl/src/main/java/com/google/jetpackcamera/ui/controller/impl/
          fi

          mkdir -p $JCA/ui/components/capture/src/main/java/com/google/jetpackcamera/ui/components/capture
          for f in DualCameraComponents.kt CaptureLayout.kt; do
            if [ -f ui/components/$f ]; then
              cp ui/components/$f $JCA/ui/components/capture/src/main/java/com/google/jetpackcamera/ui/components/capture/
            fi
          done

          SYS=$JCA/core/camera/src/main/java/com/google/jetpackcamera/core/camera/CameraSystem.kt
          if [ -f "$SYS" ] && ! grep -q setDualRecordingMode "$SYS"; then
            sed -i '/suspend fun setImageFormat/i\    suspend fun setDualRecordingMode(mode: com.google.jetpackcamera.model.DualRecordingMode)\n' "$SYS"
          fi

          SETTINGS=$JCA/core/settings/src/main/java/com/google/jetpackcamera/settings/model/CameraAppSettings.kt
          if [ -f "$SETTINGS" ]; then
            if ! grep -q DualRecordingMode "$SETTINGS"; then
              sed -i '/import com.google.jetpackcamera.model.ConcurrentCameraMode/a\import com.google.jetpackcamera.model.DualRecordingMode' "$SETTINGS"
            fi
            if ! grep -q dualRecordingMode "$SETTINGS"; then
              sed -i '/val concurrentCameraMode: ConcurrentCameraMode = ConcurrentCameraMode.OFF,/a\    val dualRecordingMode: DualRecordingMode = DualRecordingMode.PIP,' "$SETTINGS"
            fi
          fi

          SESSION=$JCA/core/camera/src/main/java/com/google/jetpackcamera/core/camera/CameraSession.kt
          if [ -f "$SESSION" ]; then
            sed -i 's/private fun getPendingRecording(/internal fun getPendingRecording(/g' "$SESSION"
            sed -i 's/private suspend fun startVideoRecordingInternal(/internal suspend fun startVideoRecordingInternal(/g' "$SESSION"
          fi

          CX=$JCA/core/camera/src/main/java/com/google/jetpackcamera/core/camera/CameraXCameraSystem.kt
          if [ -f "$CX" ] && ! grep -q setDualRecordingMode "$CX"; then
            sed -i '/override suspend fun setImageFormat/i\    override suspend fun setDualRecordingMode(mode: com.google.jetpackcamera.model.DualRecordingMode) {\n        currentSettings.update { old -> old?.copy(dualRecordingMode = mode) }\n    }\n' "$CX"
          fi

          echo "Patches applied"

      - name: Make gradlew executable
        run: chmod +x jca/gradlew

      - name: Build APK
        working-directory: jca
        run: |
          ./gradlew assembleStableDebug --no-daemon --stacktrace 2>&1 || \
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 || \
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1

      - name: List APKs
        run: find jca -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-camera-apk
          path: jca/**/*.apk
          if-no-files-found: warn
          retention-days: 14
